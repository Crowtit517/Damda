<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="theme-color" content="#6b74c9" />
  <title>담다</title>
  <meta name="description" content="하루를 담는 기록장 — 일정, 할 일, 가계부" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-head">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-haspopup="dialog"><i></i><i></i><i></i></button>
      <h1 class="brand screen-title" id="screenTitle">캘린더</h1>
      <button type="button" class="sync-pill" id="syncPill" aria-label="동기화 상태 (누르면 메뉴)"><span class="sync-dot"></span><span>이 기기에 저장</span></button>
      <button type="button" class="icon-btn help-btn" id="helpBtn" aria-label="사용 가이드" aria-haspopup="dialog">?</button>
      <button class="icon-btn" id="themeToggle" aria-label="테마 전환"></button>
    </header>

    <main>
      <section class="view" id="view-calendar" hidden></section>
      <section class="view" id="view-tasks" hidden></section>
      <section class="view" id="view-ledger" hidden></section>
    </main>
  </div>

  <!-- 겹치는 창: 모두 js/ui/overlay.js 로만 연다 -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="day-panel" id="dayPanel" hidden aria-label="하루 기록"></aside>
  <div class="modal" id="monthPicker" hidden role="dialog" aria-label="월 선택"></div>
  <div class="modal" id="menuModal" hidden role="dialog" aria-label="메뉴"></div>
  <div class="modal" id="categoryModal" hidden role="dialog" aria-label="카테고리"></div>
  <div class="modal" id="recurringModal" hidden role="dialog" aria-label="고정 항목"></div>
  <div class="modal" id="taskRuleModal" hidden role="dialog" aria-label="반복 할 일"></div>
  <div class="modal" id="settingsModal" hidden role="dialog" aria-label="설정"></div>
  <div class="modal" id="eventModal" hidden role="dialog" aria-label="일정 고치기"></div>
  <div class="modal" id="guideModal" hidden role="dialog" aria-label="사용 가이드"></div>
  <div class="modal" id="dialogModal" hidden role="alertdialog" aria-label="확인"></div>
  <div class="toast" id="toast" hidden role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
