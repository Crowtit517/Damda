<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>담다</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; font-family: 'Gowun Dodum', 'Malgun Gothic', sans-serif; }

  /* 둥근 사각형 카드 */
  .card {
    position: relative; width: 460px; height: 280px; border-radius: 28px; overflow: hidden;
    display: grid; place-items: center; text-align: center; color: #fff;
    background:
      radial-gradient(420px 260px at 18% 0%, rgba(255, 255, 255, 0.28), transparent 60%),
      radial-gradient(360px 240px at 100% 100%, rgba(255, 190, 230, 0.22), transparent 60%),
      linear-gradient(135deg, #6b74c9 0%, #7a5aa8 100%);
    border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 22px 50px -12px rgba(40, 28, 96, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    opacity: 0; transform: translateY(14px) scale(0.92);
    animation: enter 0.75s cubic-bezier(.2, .8, .2, 1) forwards;
  }
  /* 한 번 지나가는 빛 */
  .card::after {
    content: ''; position: absolute; inset: -40%;
    background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, 0.22) 50%, transparent 58%);
    transform: translateX(-60%); animation: sweep 1.6s 0.45s ease-in-out forwards;
  }

  .inner { position: relative; z-index: 1; display: grid; justify-items: center; }
  .icon {
    width: 64px; height: 64px; border-radius: 18px; margin-bottom: 14px;
    box-shadow: 0 8px 22px -6px rgba(30, 20, 80, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.35);
    opacity: 0; transform: scale(0.7); animation: pop 0.6s 0.15s cubic-bezier(.3, 1.5, .5, 1) forwards;
  }
  h1 {
    margin: 0; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 54px; line-height: 1.05; letter-spacing: -1px;
    text-shadow: 0 2px 14px rgba(30, 20, 80, 0.3);
    opacity: 0; transform: translateY(10px); animation: rise 0.6s 0.28s ease-out forwards;
  }
  p {
    margin: 10px 0 0; font-size: 15px; letter-spacing: 5px; color: rgba(255, 255, 255, 0.88);
    opacity: 0; transform: translateY(8px); animation: rise 0.6s 0.42s ease-out forwards;
  }
  /* 불러오는 중 막대 */
  .bar {
    position: relative; width: 120px; height: 3px; margin-top: 26px; border-radius: 3px; overflow: hidden;
    background: rgba(255, 255, 255, 0.22); opacity: 0; animation: rise 0.5s 0.6s ease-out forwards;
  }
  .bar::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px;
    background: linear-gradient(90deg, transparent, #fff, transparent);
    animation: load 1.1s 0.6s ease-in-out infinite;
  }

  /* 스르륵 사라지기 */
  body.leave .card { animation: leave 0.5s cubic-bezier(.4, 0, .2, 1) forwards; }

  @keyframes enter { to { opacity: 1; transform: none; } }
  @keyframes leave { from { opacity: 1; transform: none; filter: blur(0); } to { opacity: 0; transform: scale(1.04); filter: blur(6px); } }
  @keyframes pop { to { opacity: 1; transform: none; } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes sweep { to { transform: translateX(60%); } }
  @keyframes load { from { left: -40%; } to { left: 100%; } }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <img class="icon" src="icon.png" alt="" />
      <h1>담다</h1>
      <p>하루를 담는 기록장</p>
      <div class="bar" aria-hidden="true"></div>
    </div>
  </div>
</body>
</html>
