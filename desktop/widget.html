<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>담다 위젯</title>
<style>
  :root {
    --line: rgba(255,255,255,.12); --text: #f3f1ea; --soft: rgba(243,241,234,.6);
    --accent: #9ccc65; --money: #ffcc80; --field: rgba(255,255,255,.10); --cell: rgba(255,255,255,.06);
    --sun: #ff8a80; --sat: #82b1ff; --ev: rgba(130,177,255,.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--text); font: 12.5px/1.45 "Pretendard", "Malgun Gothic", system-ui, sans-serif; overflow: hidden; user-select: none; }
  .card { display: flex; flex-direction: column; background: var(--glass, rgba(28, 30, 26, .55)); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  body.view-month .card { position: absolute; inset: 6px; }
  body.view-day .card { margin: 6px; }
  body.view-month .only-day, body.view-day .only-month { display: none !important; }

  header { display: flex; align-items: center; gap: 4px; padding: 10px 10px 6px 14px; -webkit-app-region: drag; }
  header .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.view-day header .now { display: none; } /* 좁은 오늘 요약에서는 날짜를 '오늘 일정' 줄에 */ header strong { font-size: 15px; } header .now { color: var(--soft); margin-left: 6px; }
  header button { -webkit-app-region: no-drag; background: none; border: 0; color: var(--soft); min-width: 28px; height: 26px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
  header button:hover { background: var(--field); color: var(--text); }
  /* 달력 | 오늘 요약 */
  .seg { -webkit-app-region: no-drag; display: flex; background: var(--field); border-radius: 9px; padding: 2px; margin-right: 4px; }
  .seg button { height: 22px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
  .seg button.on { background: var(--accent); color: #1d2a10; font-weight: 700; }
  header .today-btn { font-size: 12px; padding: 0 6px; }

  /* ---- 달력 ---- */
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 0 12px 4px; color: var(--soft); text-align: center; font-size: 11px; }
  .dow span:first-child { color: var(--sun); } .dow span:last-child { color: var(--sat); }
  .scroll { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .scroll::-webkit-scrollbar { width: 6px; } .scroll::-webkit-scrollbar-thumb { background: var(--field); border-radius: 3px; }
  .month h2 { margin: 0; padding: 8px 2px 6px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 10px; }
  .day { min-height: 74px; background: var(--cell); border: 1px solid transparent; border-radius: 8px; padding: 4px 5px; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
  .day:hover { border-color: var(--line); background: rgba(255,255,255,.1); }
  .day.blank { background: none; cursor: default; }
  .day .n { font-weight: 600; font-size: 12px; }
  .day.sun .n { color: var(--sun); } .day.sat .n { color: var(--sat); }
  .day.today .n { background: var(--accent); color: #1d2a10; border-radius: 10px; padding: 0 6px; align-self: flex-start; }
  .day.sel { border-color: var(--accent); }
  .chip { font-size: 10.5px; background: var(--ev); border-radius: 4px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { font-size: 10px; color: var(--soft); }
  .meta { margin-top: auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 4px; font-size: 10px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .meta .m { color: var(--money); }
  .sheet { border-top: 1px solid var(--line); padding: 10px 14px 12px; max-height: 46%; overflow-y: auto; background: rgba(0,0,0,.18); }
  .sheet[hidden] { display: none; }
  .sheet h3 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 button { background: none; border: 0; color: var(--soft); cursor: pointer; }

  /* ---- 공통 목록 ---- */
  section { padding: 8px 14px 10px; border-top: 1px solid var(--line); }
  h4 { margin: 8px 0 4px; font-size: 11.5px; color: var(--soft); font-weight: 600; display: flex; justify-content: space-between; }
  section h4 { margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .ev .time { color: var(--accent); min-width: 38px; font-variant-numeric: tabular-nums; }
  .task label { display: flex; gap: 8px; align-items: center; flex: 1; cursor: pointer; }
  .task input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .task.done span { color: var(--soft); text-decoration: line-through; }
  .x { margin-left: auto; background: none; border: 0; color: var(--soft); cursor: pointer; opacity: 0; }
  li:hover .x { opacity: 1; }
  .money { color: var(--money); font-variant-numeric: tabular-nums; }
  .exp .memo { flex: 1; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--soft); font-size: 12px; }
  form { display: flex; gap: 6px; margin-top: 6px; }
  form input { flex: 1; min-width: 0; background: var(--field); border: 1px solid transparent; color: var(--text); border-radius: 8px; padding: 5px 8px; font: inherit; user-select: text; }
  form input:focus { outline: none; border-color: var(--accent); }
  form input.amt { flex: 0 0 82px; }
  form button { background: var(--accent); color: #1d2a10; border: 0; border-radius: 8px; padding: 0 10px; font-weight: 700; cursor: pointer; }
  footer { display: flex; align-items: center; gap: 8px; padding: 6px 14px 8px; color: var(--soft); font-size: 11px; border-top: 1px solid var(--line); }
  footer input { flex: 1; accent-color: var(--accent); }
  footer .grip { cursor: nwse-resize; opacity: .6; }
</style>
</head>
<body class="view-month">
<div class="card" id="card">
  <header>
    <div class="title"><strong>담다</strong><span class="now" id="now"></span></div>
    <div class="seg" role="tablist">
      <button data-view="month" role="tab">달력</button>
      <button data-view="day" role="tab">오늘 요약</button>
    </div>
    <button class="today-btn only-month" id="goToday" title="이번 달로">오늘</button>
    <button id="open" title="담다 열기">↗</button>
    <button id="hide" title="숨기기 (Ctrl+Shift+D로 다시 꺼내기)">—</button>
  </header>

  <!-- 달력 -->
  <div class="dow only-month"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div class="scroll only-month" id="scroll"></div>
  <div class="sheet only-month" id="sheet" hidden></div>

  <!-- 오늘 요약 -->
  <div class="only-day" id="dayView"></div>

  <footer>투명도 <input type="range" id="op" min="20" max="95" value="55" /><span class="grip only-month" title="모서리를 끌면 크기가 바뀌어요">⤡</span></footer>
</div>
<script type="module">
import { store } from './js/store.js';
import { getSetting } from './js/settings.js';
import { todayKey, toKey, escapeHtml, formatNumber, DOW_NAMES, keyToDate } from './js/utils.js';

const $ = id => document.getElementById(id);
const desk = window.desk || { notify() {}, widget() {}, onView() {} };
const BEFORE = 2, AFTER = 12; // 달력: 지난 2달 ~ 앞으로 12달을 아래로 이어서
let view = 'month', selected = null;
const moneyOn = () => getSetting('money'); // 담다의 💰 가계부 보기 스위치를 그대로 따른다

const sortEvents = list => list.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
const tasksOf = key => store.byDate('tasks', key).filter(t => !t.movedTo).sort((a, b) => (a.done - b.done) || (a.createdAt - b.createdAt));
const spentOf = key => store.byDate('expenses', key).filter(x => x.type === 'expense');
const sum = list => list.reduce((s, x) => s + Number(x.amount || 0), 0);
const dateLabel = key => { const d = keyToDate(key); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW_NAMES[d.getDay()]})`; };

const eventsHtml = evs => evs.length
  ? evs.map(e => `<li class="ev"><span class="time">${e.time || '종일'}</span><span>${escapeHtml(e.title)}</span></li>`).join('')
  : '<li class="empty">일정이 없어요</li>';
const tasksHtml = tasks => tasks.length
  ? tasks.map(t => `<li class="task${t.done ? ' done' : ''}" data-id="${t.id}"><label><input type="checkbox"${t.done ? ' checked' : ''} /><span>${escapeHtml(t.title)}</span></label><button class="x" data-del="tasks" title="지우기">✕</button></li>`).join('')
  : '<li class="empty">할 일이 없어요</li>';
const expsHtml = exps => exps.length
  ? exps.map(x => `<li class="exp" data-id="${x.id}"><span class="money">${formatNumber(x.amount)}원</span><span class="memo">${escapeHtml(x.memo || '')}</span><button class="x" data-del="expenses" title="지우기">✕</button></li>`).join('')
  : '<li class="empty">아직 없어요</li>';
const taskForm = '<form data-form="task"><input name="title" placeholder="할 일 추가" autocomplete="off" /><button>＋</button></form>';
const expForm = '<form data-form="exp"><input class="amt" name="amount" inputmode="numeric" placeholder="금액" autocomplete="off" /><input name="memo" placeholder="메모" autocomplete="off" /><button>＋</button></form>';

// 다시 그려도 입력 중인 글자는 남긴다
function keepInputs(root, fn) {
  const kept = [...root.querySelectorAll('form input')].map(i => [i.closest('form').dataset.form + i.name, i.value]);
  const focused = root.contains(document.activeElement) && document.activeElement.matches('form input') ? document.activeElement.closest('form').dataset.form + document.activeElement.name : null;
  fn();
  for (const [k, v] of kept) { const el = [...root.querySelectorAll('form input')].find(i => i.closest('form').dataset.form + i.name === k); if (el) el.value = v; }
  if (focused) [...root.querySelectorAll('form input')].find(i => i.closest('form').dataset.form + i.name === focused)?.focus();
}

// ---- 달력 ----
function dayCell(y, m, d, today, money) {
  const key = toKey(y, m, d), dow = new Date(y, m, d).getDay();
  const evs = sortEvents(store.eventsOn(key)), tasks = tasksOf(key), spent = money ? sum(spentOf(key)) : 0;
  const cls = ['day', dow === 0 && 'sun', dow === 6 && 'sat', key === today && 'today', key === selected && 'sel'].filter(Boolean).join(' ');
  return `<div class="${cls}" data-key="${key}"><span class="n">${d}</span>
    ${evs.slice(0, 2).map(e => `<span class="chip">${escapeHtml(e.title)}</span>`).join('')}${evs.length > 2 ? `<span class="more">+${evs.length - 2}</span>` : ''}
    <span class="meta"><span>${tasks.length ? `✓${tasks.filter(t => t.done).length}/${tasks.length}` : ''}</span><span class="m">${spent ? '-' + formatNumber(spent) : ''}</span></span></div>`;
}

function renderMonth() {
  const today = todayKey(), money = moneyOn(), t = new Date();
  const top = $('scroll').scrollTop;
  let html = '';
  for (let i = -BEFORE; i <= AFTER; i++) {
    const d0 = new Date(t.getFullYear(), t.getMonth() + i, 1), y = d0.getFullYear(), m = d0.getMonth();
    const first = d0.getDay(), last = new Date(y, m + 1, 0).getDate();
    let cells = '<div class="day blank"></div>'.repeat(first);
    for (let d = 1; d <= last; d++) cells += dayCell(y, m, d, today, money);
    html += `<section class="month" data-ym="${y}-${m}"><h2>${y}년 ${m + 1}월</h2><div class="grid">${cells}</div></section>`;
  }
  $('scroll').innerHTML = html;
  $('scroll').scrollTop = top;
  if (selected) renderSheet();
}

function renderSheet() {
  const key = selected, money = moneyOn(), exps = spentOf(key);
  keepInputs($('sheet'), () => {
    $('sheet').innerHTML = `
      <h3><span>${dateLabel(key)}</span><button data-close title="닫기">✕</button></h3>
      <h4>일정</h4><ul>${eventsHtml(sortEvents(store.eventsOn(key)))}</ul>
      <h4>할 일</h4><ul>${tasksHtml(tasksOf(key))}</ul>${taskForm}
      ${money ? `<h4><span>쓴 돈</span><span class="money">${formatNumber(sum(exps))}원</span></h4><ul>${expsHtml(exps)}</ul>${expForm}` : ''}`;
  });
  $('sheet').hidden = false;
}

function scrollToThisMonth() {
  const t = new Date(), el = $('scroll').querySelector(`[data-ym="${t.getFullYear()}-${t.getMonth()}"]`);
  if (el) $('scroll').scrollTop = el.offsetTop - $('scroll').offsetTop;
}

// ---- 오늘 요약 ----
function renderDay() {
  const key = todayKey(), tasks = tasksOf(key), exps = spentOf(key);
  keepInputs($('dayView'), () => {
    $('dayView').innerHTML = `
      <section><h4><span>오늘 일정</span><span>${dateLabel(key)}</span></h4><ul>${eventsHtml(sortEvents(store.eventsOn(key)))}</ul></section>
      <section><h4><span>할 일</span><span>${tasks.length ? `${tasks.filter(t => t.done).length}/${tasks.length}` : ''}</span></h4><ul>${tasksHtml(tasks)}</ul>${taskForm}</section>
      ${moneyOn() ? `<section><h4><span>오늘 쓴 돈</span><span class="money">${formatNumber(sum(exps))}원</span></h4><ul>${expsHtml(exps)}</ul>${expForm}</section>` : ''}`;
  });
  requestAnimationFrame(() => desk.widget('height', $('card').offsetHeight + 12));
}

function render() {
  $('now').textContent = dateLabel(todayKey());
  $('now').dataset.k = todayKey();
  if (view === 'month') renderMonth(); else renderDay();
}

function setView(v) {
  view = v;
  document.body.className = `view-${v}`;
  document.querySelectorAll('.seg [data-view]').forEach(b => { b.classList.toggle('on', b.dataset.view === v); b.setAttribute('aria-selected', b.dataset.view === v); });
  render();
  if (v === 'month') scrollToThisMonth();
}

// ---- 누르기·입력 ----
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (b && b.dataset.view !== view) { setView(b.dataset.view); desk.widget('view', view); }
});
$('scroll').addEventListener('click', e => {
  const cell = e.target.closest('.day[data-key]'); if (!cell) return;
  selected = selected === cell.dataset.key ? null : cell.dataset.key;
  if (!selected) $('sheet').hidden = true;
  render();
});
$('card').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { selected = null; $('sheet').hidden = true; return render(); }
  const li = e.target.closest('li[data-id]'); if (!li) return;
  const del = e.target.closest('[data-del]');
  if (del) return store.remove(del.dataset.del, li.dataset.id);
  if (e.target.matches('input[type=checkbox]')) store.put('tasks', { id: li.dataset.id, done: e.target.checked });
});
$('card').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, key = view === 'month' ? selected : todayKey();
  if (!key) return;
  if (f.dataset.form === 'task') {
    const title = f.title.value.trim(); if (!title) return;
    f.title.value = '';
    store.put('tasks', { date: key, title, category: null, done: false });
  } else {
    const amount = Number(String(f.amount.value).replace(/[^\d]/g, '')); if (!amount) return;
    const memo = f.memo.value.trim();
    f.amount.value = ''; f.memo.value = '';
    store.put('expenses', { date: key, type: 'expense', category: null, amount, memo });
  }
});
$('goToday').onclick = scrollToThisMonth;

desk.onView(v => { if (v !== view) setView(v); });
$('open').onclick = () => desk.widget('open-main');
$('hide').onclick = () => desk.widget('hide');

const op = $('op');
const setOp = v => $('card').style.setProperty('--glass', `rgba(28, 30, 26, ${v / 100})`);
try { op.value = localStorage.getItem('ple-widget-opacity') || 55; } catch {}
setOp(op.value);
op.oninput = () => { setOp(op.value); try { localStorage.setItem('ple-widget-opacity', op.value); } catch {} };

// ---- 알림 (PC는 소리 없이) ----
const summary = () => `남은 할 일 ${tasksOf(todayKey()).filter(t => !t.done).length}개 · 일정 ${store.eventsOn(todayKey()).length}개`;
desk.notify('담다 · 오늘', summary()); // 켜질 때 한 번
const told = new Set();
function checkSoon() { // 시간이 있는 일정은 10분 전에 한 번
  const key = todayKey(), now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  for (const e of store.eventsOn(key)) {
    if (!e.time || e.start !== key || told.has(e.id)) continue;
    const [h, m] = e.time.split(':').map(Number), diff = h * 60 + m - nowMin;
    if (diff >= 0 && diff <= 10) { told.add(e.id); desk.notify(`${diff ? diff + '분 뒤' : '지금'} · ${e.title}`, `${e.time} 일정이에요`); }
  }
}
setInterval(() => { if ($('now').dataset.k !== todayKey()) render(); checkSoon(); }, 30000);

store.subscribe(render);
// 담다에서 💰 가계부 보기 같은 설정을 바꾸면 바로 따라간다 (같은 저장소를 쓰는 다른 창의 변경 알림)
window.addEventListener('storage', e => { if (!e.key || e.key.startsWith('ple-set-')) render(); });
// 담다에서 '할 일·가계부 담는 곳'(계정)을 바꾸면 그 계정 저장소로 다시 연다 (안 그러면 예전 계정에 기록된다)
window.addEventListener('storage', e => { if (e.key === 'ple-data-acct') location.reload(); });
setView('month');
desk.widget('hello'); // 저장된 보기를 받아 온다
checkSoon();
</script>
</body>
</html>
